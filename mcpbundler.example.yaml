# MCP Bundler - YAML configuration reference
#
# Set YAML_CONFIG=./mcpbundler.yaml in .env to activate YAML mode.
#
# Secrets (tokens, API keys) belong in .env and are referenced here with
# ${VAR_NAME} syntax. Interpolation happens after YAML parsing so env var
# values cannot corrupt the YAML structure. A .env file in the same directory
# as the YAML is loaded automatically.
#
# BLOCKS
#
#   definitions   - shared named resources: MCPs and LLM providers
#   bundles       - collections of MCPs
#   subscriptions - named subscriptions: tokens, credentials, router config


definitions:

  # Shared MCP declarations. Referenced inside bundle blocks via ref: <namespace>.
  # Two forms:
  #   inline   - namespace + url (full definition lives here)
  #   external - namespace + registry (resolves from an external registry; not supported in YAML mode)
  mcps:
    - namespace: github
      url: "https://github-mcp.example.com/mcp"
      pooled: true
      description: "GitHub repository management - PRs, issues, commits, code search"
      capabilities: ["git", "pull-requests", "code-review", "code-search"]
      auth:
        method: bearer
        token: "${GITHUB_MASTER_TOKEN}"

    - namespace: filesystem
      url: "http://localhost:3001"
      pooled: false
      description: "Local filesystem read/write access"
      auth:
        method: none

    - namespace: jira
      url: "https://jira-mcp.example.com/mcp"
      description: "Jira issue tracking - create, update, search issues and projects"
      capabilities: ["issue-tracking", "project-management", "sprint-planning"]
      # No auth here - auth_strategy: USER_SET means each subscriber provides their own key

    - namespace: stripe
      url: "https://stripe-mcp.example.com/mcp"
      description: "Stripe payment processing - charges, subscriptions, invoices, customers"
      capabilities: ["payments", "billing", "invoicing"]

  # LLM providers for the tool router middleware.
  # type: openai-compatible covers Ollama and any OpenAI-compatible endpoint.
  # For cloud providers with per-user API keys, define them here and reference
  # them in subscription router.model.
  llms:
    - name: local-llama
      type: openai-compatible
      model: llama3.2:3b
      endpoint: "http://localhost:11434/v1"
      temperature: 0.1
      max_tokens: 256

    - name: local-gemma
      type: openai-compatible
      model: gemma3:4b
      endpoint: "http://localhost:11434/v1"
      temperature: 0.1
      max_tokens: 256

    - name: openai-mini
      type: openai-compatible
      model: gpt-4o-mini
      endpoint: "https://api.openai.com/v1"
      api_key: "${OPENAI_API_KEY}"
      max_tokens: 512


bundles:
  # auth_strategy per MCP entry:
  #   MASTER   - bundler injects the shared auth defined in definitions.mcps
  #   USER_SET - each subscriber must provide their own credential in their subscription
  #   NONE     - no authentication injected

  - name: developer-tools
    mcps:
      - ref: github
        auth_strategy: MASTER        # shared token from definitions

      - ref: filesystem
        auth_strategy: NONE

      - ref: jira
        auth_strategy: USER_SET      # each subscriber provides their own Jira key

      - namespace: notion            # inline definition (not declared in definitions)
        url: "https://notion-mcp.example.com/mcp"
        description: "Notion workspace - pages, databases, blocks"
        capabilities: ["note-taking", "knowledge-base", "project-docs"]
        auth_strategy: USER_SET

  - name: finance-tools
    mcps:
      - ref: stripe
        auth_strategy: USER_SET

      - namespace: market-data
        url: "https://marketdata-mcp.example.com/mcp"
        description: "Real-time and historical market data feeds"
        capabilities: ["market-data", "financial-data", "trading"]
        auth_strategy: NONE


subscriptions:
  # Each subscription links one or more named tokens to a bundle.
  # tokens: is a map of label -> bearer token value.
  # All tokens for a subscription resolve to the same bundle and credentials.
  # Use separate named tokens to issue revocable per-client access.

  - name: alice
    tokens:
      claude-desktop: "${ALICE_CLAUDE_TOKEN}"
      vscode: "${ALICE_VSCODE_TOKEN}"
    bundle: developer-tools
    credentials:
      jira:
        auth:
          method: api_key
          key: "${ALICE_JIRA_KEY}"
          header: "X-API-Token"
        permissions:
          allowed_tools: ["get_issue", "search_issues", "create_issue", "update_issue"]
          allowed_resources: ["*"]
          allowed_prompts: ["*"]
      notion:
        auth:
          method: bearer
          token: "${ALICE_NOTION_TOKEN}"
    router:
      model: local-llama
      set_context:
        enabled: true
        max_active_upstreams: 6
      rolling_window:
        enabled: true
        max_active_upstreams: 6
        window_size: 10
        re_rank_every_n_calls: 5

  - name: bob
    tokens:
      main: "${BOB_BUNDLE_TOKEN}"
    bundle: developer-tools
    credentials:
      jira:
        auth:
          method: api_key
          key: "${BOB_JIRA_KEY}"
          header: "X-API-Token"
      notion:
        auth:
          method: bearer
          token: "${BOB_NOTION_TOKEN}"
    router:
      model: allpass                 # no routing - connect all upstreams

  # Minimal subscription - all MCPs are MASTER or NONE auth, no credentials needed
  - name: readonly-agent
    tokens:
      agent: "${AGENT_TOKEN}"
    bundle: developer-tools
    router:
      model: local-gemma
      set_context:
        enabled: true
        max_active_upstreams: 4
