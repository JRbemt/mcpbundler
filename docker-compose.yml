services:
  mcpbundler:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: mcpbundler
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      # Set BACKEND_URL for API mode or YAML_CONFIG for YAML mode
      - BACKEND_URL=${BACKEND_URL:-}
      - YAML_CONFIG=${YAML_CONFIG:-}
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-info}
    restart: unless-stopped
    networks:
      - mcpbundler-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/status",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      mcpbundler:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mcpbundler-network

volumes:
  prometheus-data:
    driver: local

networks:
  mcpbundler-network:
    driver: bridge
