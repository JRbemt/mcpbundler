# Local test config - sync against a running local mcpbundler instance.
#
# Setup:
#   1. Copy to .env: ANTHROPIC_API_KEY=sk-ant-...  (or use chatgpt/gemini)
#   2. Start server:  docker compose up --build
#   3. Get root token from server logs on first boot
#   4. Sync:          mcpbundler sync --config mcpbundler.local.yaml --token <root-token>
#   5. Get MCP token: mcpbundler token test-sub --config mcpbundler.local.yaml --token <root-token>
#   6. Connect client with: Authorization: Bearer <mcp-token>

definitions:

  # Bind your personal API key to a cloud LLM provider.
  # The server seeds "claude", "chatgpt", and "gemini" as named providers at startup.
  # sync Phase 0 pushes these bindings (encrypted) to the server.
  llm_bindings:
    - provider: claude
      api_key: "${ANTHROPIC_API_KEY}"

  # Shared MCP definitions - referenced by bundle entries via ref:
  mcps:
    - namespace: fetch
      url: "https://fetch.mcp.example.com/mcp"
      description: "HTTP fetch and web scraping"
      stateless: true
      auth:
        method: none

    - namespace: filesystem
      url: "http://host.docker.internal:3001/mcp"
      description: "Local filesystem read/write"
      stateless: false
      auth:
        method: none

    - namespace: github
      url: "https://github-mcp.example.com/mcp"
      description: "GitHub - PRs, issues, code search"
      stateless: true
      auth:
        method: bearer
        token: "${GITHUB_TOKEN}"


bundles:

  - name: test-bundle
    description: "LLM router test bundle"
    mcps:
      - ref: fetch
        auth_strategy: NONE

      - ref: filesystem
        auth_strategy: NONE

      - ref: github
        auth_strategy: MASTER


subscriptions:

  # allpass - no LLM routing, all MCPs always visible. Use this to verify connectivity first.
  - name: test-sub-allpass
    bundle: test-bundle
    registry: local
    router:
      model: allpass

  # LLM-routed subscription using Claude (requires llm_bindings.claude above).
  # set_context: agent calls bundler__set_context tool to declare its task before tool use.
  # rolling_window: bundler observes recent tool calls and re-ranks automatically.
  - name: test-sub-llm
    bundle: test-bundle
    registry: local
    router:
      model: claude
      set_context:
        enabled: true
        max_active_upstreams: 5
      rolling_window:
        enabled: true
        max_active_upstreams: 5
        window_size: 10
        re_rank_every_n_calls: 5
